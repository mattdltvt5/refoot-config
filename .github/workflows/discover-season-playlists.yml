name: Discover season playlists (auto-resolve rotating IDs)

# Resolves the CURRENT-season highlights playlist within each AVAILABLE
# competition's already-known source channels (Tier-4 broadcaster + Tier-1c/1d
# team playlists) by matching real playlist names, and writes the result to
# highlights/discovered-playlists.json — which the fetch pipeline then uses in
# place of the hardcoded rotating IDs. On no confident match it keeps the mapped
# last-known-good ID and records a flag for human review.
#
# Weekly (playlists rotate at most once/season, so weekly is ample and keeps
# quota trivial) + manual dispatch. playlists.list only — never search.list.

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday 06:00 UTC (after sync-teams 04:00 / copa 05:00)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit discovered-playlists.json

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Resolve current-season playlists
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/discover_season_playlists.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add highlights/discovered-playlists.json
          git diff --cached --quiet \
            && echo "No changes to commit." \
            || (
                git commit -m "data: refresh discovered season playlists [skip ci]" \
                && git pull --rebase -X ours origin main \
                && git push
               )
