name: Sync team channel IDs from Wikidata

on:
  schedule:
    - cron: '0 5 * * 1'   # Every Monday at 05:00 UTC (after sync-teams runs at 04:00)
  workflow_dispatch:        # Manual trigger from the Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit sources.json back

    steps:
      - uses: actions/checkout@v4

      - name: Query Wikidata and update sources.json
        run: |
          python3 << 'PYEOF'
          import json, re, time, unicodedata, urllib.request, urllib.error, urllib.parse
          from datetime import date

          SPARQL_ENDPOINT = "https://query.wikidata.org/sparql"

          SPARQL_QUERY = """
          SELECT DISTINCT ?label ?channelId WHERE {
            VALUES ?type { wd:Q476028 wd:Q6979593 }
            ?item wdt:P31 ?type .
            ?item wdt:P2397 ?channelId .
            FILTER(STRSTARTS(?channelId, "UC"))
            {
              ?item rdfs:label ?label .
              FILTER(LANG(?label) = "en")
            } UNION {
              ?item skos:altLabel ?label .
              FILTER(LANG(?label) = "en")
            }
          }
          """

          def normalize(name):
              name = unicodedata.normalize('NFD', name)
              name = ''.join(c for c in name if unicodedata.category(c) != 'Mn')
              name = name.lower()
              name = name.replace('-', ' ').replace('.', '')
              name = re.sub(
                  r'\b(fc|cf|ac|sc|rc|cd|ud|rcd|ca|afc|bsc|fk|sk|de|the)\b',
                  '', name
              )
              return re.sub(r'\s+', ' ', name).strip()

          def valid_channel(cid):
              return isinstance(cid, str) and cid.startswith('UC') and len(cid) == 24

          # ── 1. Fetch Wikidata SPARQL results ─────────────────────────────────
          print("Querying Wikidata SPARQL…")
          params = urllib.parse.urlencode({
              'query':  SPARQL_QUERY,
              'format': 'json',
          })
          url = SPARQL_ENDPOINT + '?' + params
          req = urllib.request.Request(
              url,
              headers={
                  'User-Agent': 'refoot-channel-sync/1.0 (github-actions)',
                  'Accept':     'application/sparql-results+json',
              }
          )

          wikidata_rows = []
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  payload = json.loads(resp.read())
                  wikidata_rows = payload.get('results', {}).get('bindings', [])
              print(f"  Received {len(wikidata_rows)} label→channel bindings")
          except Exception as e:
              print(f"✗ Wikidata query failed: {e}")
              print("  Aborting — sources.json unchanged.")
              raise SystemExit(1)

          # ── 2. Build lookup dicts ─────────────────────────────────────────────
          # exact_lookup:  lowercase label  → channelId
          # norm_lookup:   normalized label → channelId
          # When multiple channels map to the same key, last one wins (arbitrary
          # but deterministic once the SPARQL result order is stable).
          exact_lookup = {}
          norm_lookup  = {}

          for row in wikidata_rows:
              label_val = row.get('label',     {}).get('value', '').strip()
              ch_val    = row.get('channelId', {}).get('value', '').strip()
              if not label_val or not valid_channel(ch_val):
                  continue
              exact_lookup[label_val.lower()] = ch_val
              norm_lookup[normalize(label_val)] = ch_val

          print(f"  Exact keys: {len(exact_lookup)}  Normalized keys: {len(norm_lookup)}")

          # ── 3. Load sources.json ──────────────────────────────────────────────
          with open('sources.json', encoding='utf-8') as f:
              data = json.load(f)

          if 'teams' not in data:
              data['teams'] = {}
          if 'teamLists' not in data:
              data['teamLists'] = {}

          # ── 4. Match each known team ──────────────────────────────────────────
          matched   = 0
          skipped   = 0
          not_found = []

          all_teams = set()
          for team_list in data['teamLists'].values():
              all_teams.update(team_list)

          for team_name in sorted(all_teams):
              # Skip if already configured with a valid channel ID
              existing = data['teams'].get(team_name, '').strip()
              if valid_channel(existing):
                  skipped += 1
                  continue

              # Try exact match first
              channel_id = exact_lookup.get(team_name.lower())

              # Fall back to normalized match
              if not channel_id:
                  channel_id = norm_lookup.get(normalize(team_name))

              if channel_id:
                  data['teams'][team_name] = channel_id
                  print(f"  ✓ {team_name} → {channel_id}")
                  matched += 1
              else:
                  not_found.append(team_name)

          print(f"\nResults: {matched} matched, {skipped} already set, {len(not_found)} not found")
          if not_found:
              print("  Not found on Wikidata:")
              for t in not_found:
                  print(f"    - {t}")

          data['_updated'] = str(date.today())

          with open('sources.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write('\n')

          print("\nsources.json written.")
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources.json
          git diff --cached --quiet && echo "No changes to commit." || \
            git commit -m "chore: sync team channel IDs from Wikidata [$(date -u +%Y-%m-%d)]" && git push
