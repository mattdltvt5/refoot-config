name: Backfill highlights cache

on:
  workflow_dispatch:   # manual only — never scheduled

jobs:
  backfill:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # allow the bot to commit and push highlights/

    env:
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      YOUTUBE_API_KEY:       ${{ secrets.YOUTUBE_API_KEY }}
      # Opt in to Node 24 for any JS-based actions in this workflow
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # needed for the git push step below

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run backfill
        run: python scripts/backfill_highlights.py

      # Commit updated highlights/ and runtime state files.
      # [skip ci] prevents this commit from re-triggering any workflow.
      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add highlights/
          git diff --cached --quiet \
            && echo "No changes — skipping commit" \
            || (
                git commit -m "chore: backfill highlights progress [skip ci]" \
                && git pull --rebase \
                && git push
               )
