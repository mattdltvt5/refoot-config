name: Backfill highlights cache

on:
  workflow_dispatch:   # manual only — never scheduled
    inputs:
      season:
        description: >
          Season year override — use when you need to backfill a specific
          tournament edition that differs from the automatically computed
          season (e.g. "2024" for Euro 2024, "2022" for World Cup 2022).
          Leave blank to use the automatic season logic.
        required: false
        type: string
      competition:
        description: >
          Restrict the backfill to one competition (exact name, e.g.
          "Euro Cup" or "World Cup"). Useful for targeted historical
          backfills without re-processing every competition.
          Leave blank to process all competitions.
        required: false
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # allow the bot to commit and push highlights/

    env:
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      YOUTUBE_API_KEY:       ${{ secrets.YOUTUBE_API_KEY }}
      # Optional overrides forwarded from workflow_dispatch inputs
      SEASON_OVERRIDE:      ${{ inputs.season }}
      COMPETITION_FILTER:   ${{ inputs.competition }}
      # Opt in to Node 24 for any JS-based actions in this workflow
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # needed for the git push step below

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run backfill
        run: python scripts/backfill_highlights.py

      # Commit updated highlights/ and runtime state files.
      # [skip ci] prevents this commit from re-triggering any workflow.
      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add highlights/
          git diff --cached --quiet \
            && echo "No changes — skipping commit" \
            || (
                git commit -m "chore: backfill highlights progress [skip ci]" \
                && git pull --rebase \
                && git push
               )
