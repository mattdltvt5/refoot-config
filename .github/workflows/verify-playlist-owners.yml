name: Verify playlist owners

# Runs whenever sources.json changes (new or modified playlist IDs) and on
# manual dispatch.  Resolves each PL-prefixed playlist ID against the YouTube
# API to confirm the owning channel matches the broadcaster label in sources.json.
#
# On-change gating: IDs already in highlights/playlist-owners.json are not
# re-fetched.  Only new IDs trigger an API call (typically 1–3 units per run).
# Results are written back to playlist-owners.json and committed so future runs
# can skip already-verified IDs without a re-fetch.
#
# Failure modes flagged as non-zero exit:
#   - owner mismatch  (right-length ID filed under the wrong broadcaster)
#   - unresolvable ID (private, deleted, or malformed)
#   - new uncached ID present but YOUTUBE_API_KEY not available

on:
  push:
    paths:
      - sources.json
  workflow_dispatch:

jobs:
  verify:
    name: Verify playlist owner labels
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit updated playlist-owners.json

    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Verify playlist owners
        run: python scripts/verify_playlist_owners.py

      # Commit any newly-resolved owner records so the next run can skip
      # already-verified IDs.  [skip ci] prevents a re-trigger loop.
      - name: Commit updated playlist-owners.json
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add highlights/playlist-owners.json
          git diff --cached --quiet \
            && echo "No new owner records — skipping commit" \
            || (
                git commit -m "data: update playlist-owners.json [skip ci]" \
                && git pull --rebase \
                && git push
               )
