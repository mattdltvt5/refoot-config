name: Source health scan (weekly, read-only)

# Weekly read-only health check of every configured highlight source, plus the
# rights registry (rights/{season}.json). It PROPOSES only: it never edits
# sources.json, the highlights cache, fixtures or the registry, and never runs
# fetch_highlights / backfill. YouTube calls: playlistItems.list + videos.list
# only, inside the scan's own budget (default 500 units).
#
# Commits ONLY reports/source-health/ (latest.json + dated copies, last 8 kept)
# with [skip ci], as github-actions[bot]. The QuotaTracker rewrite of
# highlights/quota-tracker.json stays uncommitted (owned by the fetch commits),
# hence --autostash on the pull.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC — after the YouTube quota reset (UTC midnight)
  workflow_dispatch:
    inputs:
      budget:
        description: "YouTube unit budget for this run (blank = 500)"
        required: false
        default: ""

concurrency:
  group: source-health-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan sources and write report
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit reports/source-health/

    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      SCAN_BUDGET: ${{ inputs.budget }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run source health scan
        run: |
          if [ -n "$SCAN_BUDGET" ]; then
            python scripts/source_health_scan.py --budget "$SCAN_BUDGET"
          else
            python scripts/source_health_scan.py
          fi

      - name: Commit report (reports/source-health/ only)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A reports/source-health/
          git diff --cached --quiet \
            && echo "No report changes to commit." \
            || {
                 git commit -m "data: weekly source health report [skip ci]" \
                 && git pull --rebase --autostash origin "$GITHUB_REF_NAME" \
                 && git push;
               }
