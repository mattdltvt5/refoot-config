name: Sync team lists from football-data.org

on:
  schedule:
    - cron: '0 4 * * 1'   # Every Monday at 04:00 UTC
  workflow_dispatch:        # Manual trigger from the Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit sources.json back

    steps:
      - uses: actions/checkout@v4

      - name: Fetch teams and update sources.json
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, os, time, urllib.request, urllib.error
          from datetime import date, datetime

          API_KEY = os.environ["FOOTBALL_DATA_API_KEY"]

          COMPETITIONS = [
              (2021, "Premier League"),
              (2014, "LaLiga"),
              (2019, "Serie A"),
              (2002, "Bundesliga"),
              (2015, "Ligue 1"),
              (2001, "Champions League"),
              (2146, "Europa League"),
              (2018, "Euro Cup"),
              (2080, "Copa America"),
              (2000, "World Cup"),
          ]

          with open("sources.json", encoding="utf-8") as f:
              data = json.load(f)

          if "teamLists" not in data:
              data["teamLists"] = {}

          for i, (comp_id, comp_name) in enumerate(COMPETITIONS):
              if i > 0:
                  time.sleep(7)   # free tier: 10 req/min
              url = f"https://api.football-data.org/v4/competitions/{comp_id}/teams"
              req = urllib.request.Request(url, headers={"X-Auth-Token": API_KEY})
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      payload = json.loads(resp.read())
                      teams = sorted(
                          [
                              {
                                  "name":     t["name"],
                                  "id":       t["id"],
                                  "tla":      t.get("tla", ""),
                                  "crestUrl": t.get("crest", ""),
                              }
                              for t in payload.get("teams", [])
                          ],
                          key=lambda x: x["name"],
                      )
                      data["teamLists"][comp_name] = teams
                      print(f"✓ {comp_name}: {len(teams)} teams")
              except urllib.error.HTTPError as e:
                  print(f"✗ {comp_name}: HTTP {e.code} — keeping existing data")
              except Exception as e:
                  print(f"✗ {comp_name}: {e} — keeping existing data")

          data["_updated"] = str(date.today())

          with open("sources.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print("sources.json written.")

          # ── Tournament group + knockout cache ──────────────────────────────
          TOURNAMENT_COMPETITIONS = [
              (2018, "Euro Cup",         "euro-cup"),
              (2000, "World Cup",        "world-cup"),
              (2001, "Champions League", "ucl"),
          ]

          KNOCKOUT_STAGES = {
              "LAST_32", "LAST_16", "QUARTER_FINALS", "SEMI_FINALS", "THIRD_PLACE", "FINAL",
          }

          os.makedirs("tournament-groups", exist_ok=True)

          for comp_id, comp_name, slug in TOURNAMENT_COMPETITIONS:
              time.sleep(7)
              standings_url = (
                  f"https://api.football-data.org/v4/competitions/{comp_id}/standings"
              )
              standings_req = urllib.request.Request(
                  standings_url, headers={"X-Auth-Token": API_KEY}
              )
              try:
                  with urllib.request.urlopen(standings_req, timeout=15) as resp:
                      standings_payload = json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  print(f"✗ {comp_name} standings: HTTP {e.code} — skipping")
                  continue
              except Exception as e:
                  print(f"✗ {comp_name} standings: {e} — skipping")
                  continue

              time.sleep(7)
              matches_url = (
                  f"https://api.football-data.org/v4/competitions/{comp_id}/matches"
              )
              matches_req = urllib.request.Request(
                  matches_url, headers={"X-Auth-Token": API_KEY}
              )
              try:
                  with urllib.request.urlopen(matches_req, timeout=15) as resp:
                      matches_payload = json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  print(f"✗ {comp_name} matches: HTTP {e.code} — skipping")
                  continue
              except Exception as e:
                  print(f"✗ {comp_name} matches: {e} — skipping")
                  continue

              # Log every stage value FD returned (confirms LAST_32 vs any other spelling).
              all_stages = sorted({m.get("stage", "") for m in matches_payload.get("matches", [])})
              print(f"  {comp_name} stages in raw FD response: {all_stages}")

              # Build group-stage fixtures (matchday-grouped, separate array).
              # Group matches are those with a non-null "group" field that are
              # NOT in the knockout stages set.  UCL league-phase matches have
              # group=None, so they produce an empty list naturally.
              group_matches = []
              for m in matches_payload.get("matches", []):
                  if m.get("stage") in KNOCKOUT_STAGES:
                      continue
                  raw_group = m.get("group")
                  if not raw_group:
                      continue  # no group field → league phase or qualifying; skip
                  matchday = m.get("matchday")
                  if not matchday:
                      continue
                  group_key = raw_group.upper().replace(" ", "_")  # "Group A" → "GROUP_A"
                  ht    = m.get("homeTeam", {}) or {}
                  at    = m.get("awayTeam", {}) or {}
                  score = m.get("score", {}) or {}
                  ft    = score.get("fullTime", {}) or {}
                  group_matches.append({
                      "group":       group_key,
                      "matchday":    matchday,
                      "sourceRound": f"Matchday {matchday}",
                      "homeTeam": {
                          "id":    ht.get("id"),
                          "name":  ht.get("name", ""),
                          "tla":   ht.get("tla", ""),
                          "crest": ht.get("crest", ""),
                      },
                      "awayTeam": {
                          "id":    at.get("id"),
                          "name":  at.get("name", ""),
                          "tla":   at.get("tla", ""),
                          "crest": at.get("crest", ""),
                      },
                      "score": {
                          "fullTime": {"home": ft.get("home"), "away": ft.get("away")},
                      },
                      "status": m.get("status", ""),
                  })

              tournament_data = {
                  "generated_at": datetime.utcnow().isoformat() + "Z",
                  "slug": slug,
                  "standings": [
                      s for s in standings_payload.get("standings", [])
                      if s.get("type") == "TOTAL"
                  ],
                  "matches": [
                      m for m in matches_payload.get("matches", [])
                      if m.get("stage") in KNOCKOUT_STAGES
                  ],
                  "groupMatches": group_matches,
              }

              out_path = f"tournament-groups/{slug}.json"
              with open(out_path, "w", encoding="utf-8") as f:
                  json.dump(tournament_data, f, indent=2, ensure_ascii=False)
                  f.write("\n")

              print(f"✓ {comp_name}: {out_path} written")

          PYEOF

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources.json tournament-groups/
          git diff --cached --quiet \
            && echo "No changes to commit." \
            || (
                git commit -m "chore: sync team data [$(date -u +%Y-%m-%d)]" \
                && git push
               )
