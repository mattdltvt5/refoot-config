name: Sync team lists from football-data.org

on:
  schedule:
    - cron: '0 4 * * 1'   # Every Monday at 04:00 UTC
  workflow_dispatch:        # Manual trigger from the Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit sources.json back

    steps:
      - uses: actions/checkout@v4

      - name: Fetch teams and update sources.json
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, os, pathlib, sys, time, urllib.request, urllib.error
          from datetime import date, datetime

          # Manual crest overrides (per FD team id) — e.g. Le Mans (535), whose FD
          # crest is a flutter_svg-incompatible Wikipedia SVG. Keeps the roster
          # crestUrl fixed across resyncs. Single source of truth in scripts/.
          sys.path.insert(0, "scripts")
          from highlights_common import override_crest

          API_KEY = os.environ["FOOTBALL_DATA_API_KEY"]

          COMPETITIONS = [
              (2021, "Premier League"),
              (2014, "LaLiga"),
              (2019, "Serie A"),
              (2002, "Bundesliga"),
              (2015, "Ligue 1"),
              (2001, "Champions League"),
              (2146, "Europa League"),
              (2018, "Euro Cup"),
              (2080, "Copa America"),
              (2000, "World Cup"),
          ]

          with open("sources.json", encoding="utf-8") as f:
              data = json.load(f)

          if "teamLists" not in data:
              data["teamLists"] = {}

          for i, (comp_id, comp_name) in enumerate(COMPETITIONS):
              if i > 0:
                  time.sleep(7)   # free tier: 10 req/min
              url = f"https://api.football-data.org/v4/competitions/{comp_id}/teams"
              req = urllib.request.Request(url, headers={"X-Auth-Token": API_KEY})
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      payload = json.loads(resp.read())
                      teams = sorted(
                          [
                              {
                                  "name":     t["name"],
                                  "id":       t["id"],
                                  "tla":      t.get("tla", ""),
                                  "crestUrl": override_crest(t["id"], t.get("crest", "")),
                              }
                              for t in payload.get("teams", [])
                          ],
                          key=lambda x: x["name"],
                      )
                      data["teamLists"][comp_name] = teams
                      print(f"✓ {comp_name}: {len(teams)} teams")
              except urllib.error.HTTPError as e:
                  print(f"✗ {comp_name}: HTTP {e.code} — keeping existing data")
              except Exception as e:
                  print(f"✗ {comp_name}: {e} — keeping existing data")

          data["_updated"] = str(date.today())

          with open("sources.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print("sources.json written.")

          # NOTE: the tournament-groups cache (standings + knockout scores/status
          # + group fixtures + video IDs) is NO LONGER written here.  It now lives
          # in fetch-highlights.yml (scripts/sync_tournaments.py) so scores refresh
          # on the ~4-hour cadence instead of this weekly roster run.  This job is
          # purely roster/TeamLists work — it must not write tournament-groups/.

          PYEOF

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources.json
          git diff --cached --quiet \
            && echo "No changes to commit." \
            || (
                git commit -m "chore: sync team data [$(date -u +%Y-%m-%d)]" \
                && git push
               )
