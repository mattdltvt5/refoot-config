name: Backfill Copa America highlights

on:
  workflow_dispatch:   # manual only — never scheduled (quota discipline)

jobs:
  backfill:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # allow the bot to commit and push highlights/

    env:
      APISPORTS_API_KEY: ${{ secrets.APISPORTS_API_KEY }}
      YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
      # Opt in to Node 24 for any JS-based actions in this workflow
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # needed for the git push step below

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run Copa America backfill
        run: python scripts/backfill_copa_america.py

      # Copa events are static (2024 is complete); one-time fetch of per-match
      # goal & card events via API-Sports /fixtures/events -> events/copa-america/
      # {season}.json. ~1 call/fixture, well under the 100/day free-tier cap.
      - name: Backfill Copa America match events (goals & cards)
        run: python scripts/backfill_copa_events.py

      # Backstop commit: catches any highlights/ changes not committed by the
      # script itself (e.g. partial run, quota hit before the script's own push).
      # [skip ci] prevents this commit from re-triggering any workflow.
      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add highlights/ events/
          git diff --cached --quiet \
            && echo "No changes — skipping commit" \
            || (
                git commit -m "chore: backfill Copa America highlights + events [skip ci]" \
                && git pull --rebase \
                && git push
               )
