name: Sync league standings from football-data.org

on:
  schedule:
    - cron: '0 7 * * *'   # Every day at 07:00 UTC (after overnight results)
  workflow_dispatch:        # Manual trigger from the Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit standings/ back to the repo

    steps:
      - uses: actions/checkout@v4

      - name: Sync standings
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python3 scripts/sync_standings.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add standings/
          git diff --cached --quiet \
            && echo "No changes to commit." \
            || (
                git commit -m "chore: sync standings [$(date -u +%Y-%m-%d)]" \
                && git push
               )
