name: Quality recheck — tier-2 channel videos

on:
  workflow_dispatch:
    inputs:
      competition:
        description: >
          Restrict the audit to one competition (exact name, e.g. "LaLiga"
          or "Premier League").  Leave blank to check all competitions.
        required: false
        type: string

jobs:
  recheck:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      YOUTUBE_API_KEY:    ${{ secrets.YOUTUBE_API_KEY }}
      COMPETITION_FILTER: ${{ inputs.competition }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python scripts/quality_recheck_tier2.py
