name: Fetch highlights cache

on:
  # Sole trigger: an external reliable scheduler (cron-job.org) calls the
  # workflow_dispatch API every 5 minutes. GitHub’s own `schedule:` cron was
  # removed — it fires unreliably (~15–25 min in practice), and running it
  # alongside the external scheduler caused overlapping runs and push-rebase
  # conflicts. One scheduler = no dual-scheduler races.
  workflow_dispatch:   # external cron-job.org every 5 min (and manual from the Actions tab)

# Prevent overlapping runs by construction.  cancel-in-progress: false means a
# new run queues behind the in-progress one rather than killing it mid-commit.
# At most one queued run exists at a time (later triggers replace the queued slot,
# not the active one), so the FD 10-req/min guarantee is never broken by two
# concurrent runs, and no commit is interrupted.
concurrency:
  group: fetch-highlights
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # allow the bot to commit and push highlights/

    env:
      FOOTBALL_DATA_API_KEY:   ${{ secrets.FOOTBALL_DATA_API_KEY }}
      YOUTUBE_API_KEY:         ${{ secrets.YOUTUBE_API_KEY }}
      # Opt in to Node 24 for any JS-based actions in this workflow
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # needed for the git push step below

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and write highlights cache
        run: python scripts/fetch_highlights.py

      # Single frequent tournament-cache refresher: rebuilds the FULL tournament
      # cache (scores + status + all FD match fields + standings + groupMatches)
      # for the FD tournaments, then grafts matched video IDs across every
      # tournament-groups/*.json (incl. copa-america) from the highlights just
      # written.  football-data.org only — NO API-Sports calls (Copa scores stay
      # owned by scripts/sync_copa_tournament.py's weekly job).  This is what
      # keeps knockout SCORES/STATUS fresh on the ~4-hour cadence instead of the
      # old weekly roster cron.
      - name: Refresh tournament cache (scores, status, video IDs)
        run: python scripts/sync_tournaments.py

      # Refresh standings only for competitions with a match finished in the last
      # few hours (smart-skip) - reads the fixtures artifacts (leagues) and
      # tournament-groups/ucl.json (UCL) written just above, so 0 extra
      # football-data calls on quiet cycles. football-data only (no API-Sports).
      # sync-standings.yml still runs daily as a full backstop.
      - name: Refresh standings (recent-finish only)
        run: python scripts/sync_standings.py --if-recent-finish

      # Push notifications for favourite teams. Compares the match state just
      # built (all artifacts above) with HEAD, records goal / disallowed / final /
      # highlights events in push-events/ (events-YYYY-MM.jsonl + a dedupe
      # ledger) and POSTs them to the pushEvents Cloud Function, which notifies
      # the teams' subscribers. Failed posts wait in push-events/pending.json for
      # the next run. Without the secret it only logs. Never fails the run.
      # The Home index was first built by fetch_highlights.py, BEFORE the
      # tournament sync above refreshed UCL/WC/Euro/Copa scores - so the
      # committed file ran one run (~5 min) behind the notifications. Rebuild
      # it now from the fresh files, so what's published matches what's
      # announced.
      - name: Rebuild Home index from the fresh scores
        continue-on-error: true
        run: python scripts/build_home_index.py

      # Detect and QUEUE notifications before the commit (they're recorded in
      # push-events/ with the data); they're SENT only after the push below,
      # so the app already shows the score a notification announces.
      - name: Detect push-notification events
        continue-on-error: true
        run: python scripts/push_events.py --mode detect

      # Only commit when real data changed. Every run rewrites its run
      # timestamps, so a plain "anything changed?" check committed every ~5 min
      # (and each push rebuilt Pages). scripts/commit_gate.py skips
      # timestamp-only changes, but still commits a heartbeat once the data's
      # timestamps are 3 h old so the app's freshness checks (fixtures: 6 h)
      # never see stale data during a quiet spell.
      # [skip ci] prevents this commit from re-triggering the workflow.
      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add highlights/ tournament-groups/ fixtures/ standings/ home-index/ results/ push-events/
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
            exit 0
          fi
          if [ "$(python scripts/commit_gate.py --heartbeat-hours 3)" = "skip" ]; then
            echo "Timestamp-only changes — skipping commit"
            # Unstage them: otherwise the notification step's commit below
            # swept these timestamp-only files in ("chore: push retry queue"
            # on nearly every run - 156 commits on 2026-10-24).
            git reset -q
            exit 0
          fi
          git commit -m "chore: update highlights cache [skip ci]"
          # Self-healing push: a concurrent run can leave a competing data commit on
          # main, making a plain rebase conflict on the regenerated JSON. Retry up to
          # 5 times, re-pulling fresh each attempt; on conflict prefer THIS run's
          # freshly generated data (-X theirs) since regenerated files are
          # deterministic outputs and last-write-wins is acceptable. Never force-push.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt hit a race; aborting rebase and retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 4) + 2 ))
          done
          echo "ERROR: could not push after 5 attempts (persistent push race)" >&2
          exit 1

      # Publish, then notify: send this run's notifications only once the data
      # is on main (or there was nothing to commit). Skipped when the push
      # failed: the events weren't pushed into the ledger either, so the next
      # run detects them again. A failed SEND keeps them in
      # push-events/pending.json, committed here (rare) so the next run retries.
      - name: Send push notifications
        continue-on-error: true
        env:
          PUSH_EVENTS_SECRET: ${{ secrets.PUSH_EVENTS_SECRET }}
        run: |
          python scripts/push_events.py --mode deliver
          git add push-events/pending.json
          # Only the retry queue itself: check and commit just this path, so
          # nothing else left in the index can ride along.
          if ! git diff --cached --quiet -- push-events/pending.json; then
            git commit -m "chore: push retry queue [skip ci]" -- push-events/pending.json
            # --autostash: a skipped run leaves its timestamp-only edits
            # unstaged in the tree, which a plain pull --rebase refuses.
            for attempt in 1 2 3; do
              if git pull --rebase --autostash -X theirs origin main && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep 3
            done
          fi
